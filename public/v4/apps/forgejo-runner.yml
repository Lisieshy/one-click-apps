captainVersion: 4

services:
    $$cap_appname:
        image: data.forgejo.org/forgejo/runner:$$cap_runner_version

        volumes:
            - $$cap_appname-data:/data
            - /var/run/docker.sock:/var/run/docker.sock

        command: >-
            sh -ec '
                mkdir -p /data;

                cat > /data/config.yml <<EOF
            log:
                level: info
            runner:
                capacity: 1
            container:
                docker_host: automount
            server:
                connections:
                    main:
                        url: "$$cap_forgejo_url"
                        uuid: "$$cap_runner_uuid"
                        token: "$$cap_runner_token"
                        labels:
                            - "$$cap_runner_label:docker://$$cap_runner_image"
            EOF
                exec forgejo-runner daemon --config /data/config.yml
            '

        caproverExtra:
            notExposeAsWebApp: 'true'

caproverOneClickApp:
    variables:
        - id: $$cap_runner_version
          label: Forgejo Runner Version
          defaultValue: '13'
          description: 'Forgejo Runner Version. Pin this to a specific release.'
          validRegex: /^([^\s^\/])+$/

        - id: $$cap_forgejo_url
          label: Forgejo URL
          description: 'Complete URL of your Forgejo instance.'
          validRegex: /^https?:\/\/.+$/

        - id: $$cap_runner_uuid
          label: Runner UUID
          description: 'UUID generated by Forgejo when creating the runner.'

        - id: $$cap_runner_token
          label: Runner Token
          description: 'Secret token generated by Forgejo when creating the runner.'

        - id: $$cap_runner_label
          label: Runner Label
          defaultValue: node26
          description: 'The runs-on label used in the Forgejo workflows yaml file.'
          validRegex: /^[a-zA-Z0-9._-]+$/

        - id: $$cap_runner_image
          label: Runner Default Image
          defaultValue: sha256:e7bc1a4cd2419953c91f9a6f7bb6efb3737773093fb4ded0b1c77a0a5831fac4
          description: |-
              The default image that will be used by this runner to run its workflows.
              Defaults to node:26-bookworm. This can also be used to specify custom
              container repositories if needed.

    instructions:
        start: |-
            This deploys a Forgejo Actions runner using Docker.

            It uses the CapRover host Docker socket so that Forgejo
            Actions can execute Docker jobs and docker build/run commands.

            This means  /var/run/docker.sock is mounted into the container
            of the runner. As a consequence, it will have full access to
            all the other containers running on the host system. Only give
            access to this runner to trusted repositories and users.

            In your Forgejo, create a runner and enter its UUID and token
            below.

        end: |-
            Forgejo Runner has been deployed.

            Use the following label in your Forgejo workflow:

                runs-on: $$cap_runner_label

            Docker access is provided through the host Docker socket.

            For security, only assign this runner to trusted repositories
            and users.

    displayName: Forgejo Runner

    isOfficial: false

    description: 'Forgejo Actions runner for CapRover with Docker support.'

    documentation: https://forgejo.org/docs/latest/admin/actions/docker-access/
